name: tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          # CLI arguments
          args: --check lua/ tests/
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Neovim version.
          - os: ubuntu-latest
            version: v0.12.0
          - os: ubuntu-latest
            version: stable
          # Catch upcoming Neovim changes early.
          - os: ubuntu-latest
            version: nightly
          # Platform smoke test: fold and timing behavior differ on macOS.
          - os: macos-latest
            version: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        id: neovim
        with:
          neovim: true
          version: ${{ matrix.version }}
      - name: Run tests
        run: make test
  treesitter-windows:
    # tests/test.lua installs the tree-sitter grammar and skips the suite on
    # win32, so this job covers the install only; tests do not run on Windows.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        id: neovim
        with:
          neovim: true
          version: stable
      - name: Install the tree-sitter grammar
        run: nvim --headless --clean -u tests/test.lua
